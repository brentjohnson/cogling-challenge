[workspace]
resolver = "3"
members = [
    "crates/game-core",
    "crates/games/tictactoe",
    "crates/games/connect4",
    "crates/protocol",
    "crates/eventlog",
    "crates/sim",
    "crates/server",
    "crates/sdk",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
cogling-game-core = { path = "crates/game-core" }
cogling-tictactoe = { path = "crates/games/tictactoe" }
cogling-connect4 = { path = "crates/games/connect4" }
cogling-protocol = { path = "crates/protocol" }
cogling-eventlog = { path = "crates/eventlog" }
cogling-sim = { path = "crates/sim" }
cogling-server = { path = "crates/server" }
cogling-sdk = { path = "crates/sdk" }

# External crates
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
rand = "0.10.3"
rayon = "1.12.0"
schemars = { version = "1.2.3", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
